[package]
name = "allins3"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[dependencies]
async-trait = "=0.1.92"
base64 = "=0.22.1"
bytes = "=1.12.1"
crc32fast = "=1.5.2"
futures-core = "=0.3.34"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", features = ["server", "tokio", "http1"] }
md-5 = "=0.10.6"
s3s = { version = "=0.16.1", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
sha1 = "=0.10.7"
sha2 = "=0.10.9"
thiserror = "=2.0.20"
time = { version = "0.3.55", default-features = false, features = ["std"] }
tokio = { version = "=1.53.1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
    "sync",
    "macros",
    "signal",
] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
toml = "=0.9.12"

[dev-dependencies]
futures-util = "=0.3.34"
tokio = { version = "=1.53.1", features = ["full"] }

[features]
default = []
# Enables the test-support drivers, fault injector and reusable contract-test
# harness from the `allins3::testing` module.
testing = []

[[test]]
name = "contract_reference"
required-features = ["testing"]

[[test]]
name = "contract_fault"
required-features = ["testing"]

[[test]]
name = "service_multipart"
required-features = ["testing"]

[[test]]
name = "service_limits"
required-features = ["testing"]

[[test]]
name = "property_parsing"
required-features = ["testing"]
