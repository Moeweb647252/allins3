[package]
name = "allins3"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[dependencies]
async-trait = "=0.1.92"
base64 = "=0.22.1"
bytes = "=1.12.1"
crc32fast = "=1.5.2"
futures-core = "=0.3.34"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", features = ["server", "tokio", "http1"] }
md-5 = "=0.10.6"
# Only behind the `yun139` feature: the 139 cloud-drive driver needs an outbound
# HTTPS client. Rustls with the platform verifier is reqwest 0.13's default TLS
# trust source (system roots); `json`/`stream` cover the signed JSON API and the
# presigned-URL downloads. Recorded in ADR-0005.
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "stream"], optional = true }
s3s = { version = "=0.16.1", default-features = false }
# Only behind the `testing` feature: the in-process protocol harness signs its
# own requests with the same crate the server verifies them with.
s3s-sigv4 = { version = "=0.16.1", optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
# Only behind the `yun139` feature, alongside `reqwest`: the drive API returns
# untyped JSON envelopes whose payload shape varies per endpoint.
serde_json = { version = "=1.0.151", optional = true }
sha1 = "=0.10.7"
sha2 = "=0.10.9"
thiserror = "=2.0.20"
time = { version = "0.3.55", default-features = false, features = ["std"] }
tokio = { version = "=1.53.1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
    "sync",
    "macros",
    "signal",
    # The always-compiled filesystem driver (`src/drivers/fs`).
    "fs",
] }
tokio-util = { version = "=0.7.19", features = ["rt", "io"] }
toml = "=0.9.12"

[dev-dependencies]
futures-util = "=0.3.34"
libc = "=0.2.189"
# `test-util` is what lets the timeout tests drive a paused clock.
tokio = { version = "=1.53.1", features = ["full", "test-util"] }

[features]
default = []
# Enables the test-support drivers, fault injector, reusable contract-test
# harness and the in-process protocol harness from the `allins3::testing` module.
testing = ["dep:s3s-sigv4"]
# The read-only 139 cloud-drive driver and its outbound HTTPS client (ADR-0017).
yun139 = ["dep:reqwest", "dep:serde_json"]

[[test]]
name = "contract_reference"
required-features = ["testing"]

[[test]]
name = "contract_fs"
required-features = ["testing"]

[[test]]
name = "contract_yun139"
required-features = ["testing", "yun139"]

[[test]]
name = "contract_fault"
required-features = ["testing"]

[[test]]
name = "service_multipart"
required-features = ["testing"]

[[test]]
name = "service_limits"
required-features = ["testing"]

[[test]]
name = "property_parsing"
required-features = ["testing"]

[[test]]
name = "property_protocol"
required-features = ["testing"]

[[test]]
name = "resource_budget"
required-features = ["testing"]
