[package]
name = "allins3"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[dependencies]
async-trait = "=0.1.92"
bytes = "=1.12.1"
futures-core = "=0.3.34"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["sync", "time", "rt", "macros"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }

[dev-dependencies]
futures-util = "=0.3.34"
tokio = { version = "=1.53.1", features = ["full"] }

[features]
default = []
# Enables the test-support drivers, fault injector and reusable contract-test
# harness from the `allins3::testing` module.
testing = []

[[test]]
name = "contract_reference"
required-features = ["testing"]

[[test]]
name = "contract_fault"
required-features = ["testing"]
